<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; width:260px; font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color:#1f2937; }
  .wrap { padding:14px 16px; }
  h1 { font-size:15px; margin:0 0 10px; }
  .switch { display:flex; gap:8px; align-items:center; font-weight:600; margin-bottom:10px; }
  .muted { color:#6b7280; font-size:12px; }
  .bad { color:#b3261e; } .ok { color:#137333; }
  button { margin-top:12px; width:100%; padding:7px; border-radius:8px; border:1px solid #174ea6; background:#fff; color:#174ea6; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📬 FiS Mail Takip</h1>
  <label class="switch"><input type="checkbox" id="enabled"> Takip açık</label>
  <div id="state" class="muted"></div>
  <div id="last" class="muted" style="margin-top:8px"></div>
  <button id="opts">Ayarlar</button>
  <div id="ver" class="muted" style="margin-top:8px;text-align:center"></div>
</div>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
